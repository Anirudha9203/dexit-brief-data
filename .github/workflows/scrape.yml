name: Daily scrape
on:
  schedule:
    - cron: "30 23 * * *"  # 05:00 IST (GitHub often runs scheduled jobs late)
    - cron: "45 0 * * *"   # 06:15 IST backup run
  workflow_dispatch:
  push:
    paths: ["scrape.py", "sources.txt", "feeds.txt", "keywords.txt", ".github/workflows/scrape.yml"]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Commit results
        run: |
          git config user.name "scrape-bot"
          git config user.email "scrape-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Scrape $(date -u +%F)"
          git push
